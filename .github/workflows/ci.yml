name: CI Quality Gate

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Build & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Ensure Maven Wrapper Permissions
        run: chmod +x backend/mvnw

      - name: Run Backend Tests
        working-directory: backend
        run: ./mvnw clean test

      - name: Package Backend Application
        working-directory: backend
        run: ./mvnw package -DskipTests

  frontend-check:
    name: Frontend Lint, Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript Strict Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build Next.js Production Bundle
        working-directory: frontend
        run: npm run build
